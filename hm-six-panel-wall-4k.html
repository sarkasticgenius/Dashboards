<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Six-Panel Operations Wall · 11520×4320</title><style>*{box-sizing:border-box}body{margin:0;background:#031019;overflow:hidden}#wall{width:11520px;height:4320px;display:grid;grid-template-columns:repeat(3,3840px);grid-template-rows:repeat(2,2160px);transform-origin:top left}iframe{width:3840px;height:2160px;border:2px solid #235864;background:#06141d}</style></head><body><div id="wall"><iframe title="hm-operations-command-center" src="hm-operations-command-center.html?panel=1" loading="eager"></iframe><iframe title="hm-retail-media-live" src="hm-retail-media-live.html?panel=1" loading="eager"></iframe><iframe title="hm-player-intelligence" src="hm-player-intelligence.html?panel=1" loading="eager"></iframe><iframe title="hm-live-wall" src="hm-live-wall.html?panel=1" loading="eager"></iframe><iframe title="hm-black-screen-intelligence" src="hm-black-screen-intelligence.html?panel=1" loading="eager"></iframe><iframe title="hm-network-map" src="hm-network-map.html?panel=1" loading="eager"></iframe></div><script>document.querySelectorAll("iframe").forEach(frame=>frame.addEventListener("load",()=>{const doc=frame.contentDocument;if(!doc)return;const style=doc.createElement("style");style.textContent="body.cms-panel{zoom:2;height:50vh}body.cms-panel main{height:50vh}";doc.head.append(style);frame.contentWindow.dispatchEvent(new Event("resize"));}));function fit(){const scale=Math.min(innerWidth/11520,innerHeight/4320);document.getElementById('wall').style.transform='scale('+scale+')';}addEventListener('resize',fit);fit();</script></body></html>
